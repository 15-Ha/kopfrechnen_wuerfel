.wrap{max-width:900px;margin:0 auto;padding:18px 16px 160px}
h1{margin:6px 0 2px;font-size:44px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,var(--brand),var(--brand2) 60%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card h2{margin:0 0 12px;font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.row2{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.lbl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:#0f1530;border-radius:999px;padding:9px 18px;min-height:44px;font-weight:800}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--brand),var(--brand2));border-color:transparent;color:#0b0f1f;box-shadow:0 0 16px rgba(34,211,238,.45)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.theme{border:2px solid var(--line);background:#0f1530;border-radius:16px;padding:14px;text-align:left;min-height:84px}
.theme[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 18px rgba(34,211,238,.4)}
.theme b{display:block;font-size:19px;margin-bottom:4px}
.theme span{color:var(--muted);font-size:14px}
.plist{display:grid;gap:8px;margin-top:12px}
.prow2{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 10px currentColor}
.prow2 input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;min-height:44px;background:#0f1530}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#0f1530;font-size:20px;font-weight:800}
.step output{min-width:64px;text-align:center;font-weight:800}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#0f1530;min-height:44px;max-width:100%}
.field{display:grid;gap:6px;margin:12px 0}
.preview{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{background:#0f1530;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--brand);font-size:22px;font-weight:800;padding:6px 10px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;padding:8px 0;min-height:44px}
.tog{display:flex;align-items:center;gap:10px;min-height:44px}
.tog input{width:24px;height:24px;accent-color:var(--brand)}
.link{min-height:44px;min-width:44px}
.fields{display:grid;gap:14px;margin-top:10px}
.appicon{font-size:46px;line-height:1;margin-top:6px}
.stepper{display:flex;gap:8px;margin:0 0 16px}
.stp{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:#0f1530;color:var(--muted);border-radius:14px;padding:10px 6px;font-weight:800;font-size:14px;min-width:0}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1b2447;color:var(--ink);font-size:13px;flex:0 0 auto}
.stp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp.on{border-color:var(--brand);color:#fff;box-shadow:0 0 16px rgba(34,211,238,.35)}
.stp.on i{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b0f1f}
.stp.done i{background:var(--ok);color:#06210f}
@media (max-width:520px){.stp span{display:none}.stp.on span{display:inline}}
.sh{margin:16px 0 4px;font-size:17px}
.hint.rules{font-size:15px;line-height:1.5;color:var(--ink)}
.startbar{flex-direction:column;align-items:center;gap:8px}
.brow{display:flex;gap:10px;width:100%;max-width:900px}

<body>
<noscript>Diese App benötigt JavaScript.</noscript>
<div id="setup"><div class="wrap" id="setupBody"></div></div>
<div id="game"></div>
<script>
'use strict';
/* =====================================================================
   KOPFSACHE WÜRFEL – eigenständige Kopfrechen-App für 2–5 Personen an einem Gerät
   ---------------------------------------------------------------------
   SPIELPRINZIP (analog + digital)
   Das Gerät liegt in der Tischmitte und zeigt allen dieselbe Aufgabe
   (zweimal: einmal für unten, einmal gedreht für oben Sitzende).
   Wer die Lösung hat, ruft «Stop» und tippt auf sein STOP-Feld.
   Die Person nennt ihre Lösung, die Gruppe prüft (Lösung zeigen) und tippt
     ✓  → die Person erhält 1 Punkt
     ✗  → die Person ist raus; je nach Einstellung Sperre für die nächste Runde und/oder −1 Punkt
   Punkte lassen sich mit + / − jederzeit von Hand korrigieren.

   AUFBAU
   1. Kern (Zufall, Formatierung, Rechen-Löser)
   2. THEMEN-MODULE → registerTheme({... games:[...] })
   3. Plattform (Einrichtung, Spielablauf, Darstellung)

   NEUE SPIELFORM / NEUES THEMA
   registerTheme({ id, name, icon, blurb, games:[ GAME, ... ] })
   GAME = {
     id, name, icon, blurb, rules,        // Anzeige in der Einrichtung
     defaults() -> settings,              // Start-Einstellungen
     presetOptions() / applyPreset(s,v),  // optional (z. B. Level, Stufen)
     fields:[{key,label,type:'select'|'toggle'|'chips',options}],
     describe(s) -> string,
     preview(s) -> [string],              // optional: Beispiele
     createRound(s, rng) -> { solutions:[string], ...eigene Daten },
     renderBoard(round, revealed) -> Element   // Spielbrett (wird 2× gezeigt)
   }
   ===================================================================== */

/* ---------- 1. Kern ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,min,max)=>min+Math.floor(r()*(max-min+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=n=>Number(n).toLocaleString('de-CH');
const THEMES={};
function registerTheme(t){THEMES[t.id]=t}

/* Löser: kombiniert Zahlen mit + − × ÷ (jede Zahl genau einmal) */
const strip=e=>e.startsWith('(')&&e.endsWith(')')?e.slice(1,-1):e;
function combos(a,b,ops,intOnly){
  const out=[],w=(x,y,o,v)=>out.push({v,e:`(${x.e} ${o} ${y.e})`});
  if(ops.includes('+'))w(a,b,'+',a.v+b.v);
  if(ops.includes('×'))w(a,b,'×',a.v*b.v);
  if(ops.includes('−')){if(a.v-b.v>0)w(a,b,'−',a.v-b.v);if(b.v-a.v>0)w(b,a,'−',b.v-a.v)}
  if(ops.includes('÷')){
    if(b.v!==0){const q=a.v/b.v;if(!intOnly||Number.isInteger(q))w(a,b,'÷',q)}
    if(a.v!==0){const q=b.v/a.v;if(!intOnly||Number.isInteger(q))w(b,a,'÷',q)}
  }
  return out;
}
function walk(list,ops,intOnly,cb){            // cb(item) -> true = abbrechen
  if(list.length===1)return cb(list[0])===true;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const rest=list.filter((_,k)=>k!==i&&k!==j);
    for(const c of combos(list[i],list[j],ops,intOnly))if(walk([...rest,c],ops,intOnly,cb))return true;
  }
  return false;
}
const opsOf=s=>{const o=[s.add&&'+',s.sub&&'−',s.mul&&'×',s.div&&'÷'].filter(Boolean);return o.length?o:['+']};
const OPCHIPS=[{k:'add',l:'＋ Plus'},{k:'sub',l:'− Minus'},{k:'mul',l:'× Mal'},{k:'div',l:'÷ Geteilt'}];
const selField=(key,label,arr,f=v=>String(v))=>({key,label,type:'select',options:arr.map(v=>({v,l:f(v)}))});
function presetKit(list,def){
  return {
    presetOptions(){return [...list.map(p=>({v:p.v,l:p.l})),{v:'custom',l:'Benutzerdefiniert'}]},
    applyPreset(s,v){s.preset=v;if(v!=='custom')Object.assign(s,list.find(p=>p.v===v).vals)},
    defaults(){return {preset:list[def].v,...list[def].vals}}
  };
}

/* Eingegebene Rechnung prüfen: toks = [{t:'n',i,v}|{t:'o',c:'+−·:()'}], jede Zahl genau einmal.
   -> {st:'incomplete'|'syntax'|'ok'|'nonint', val} (Brüche exakt als [Zähler,Nenner]) */
function evalToks(toks,count,intOnly){
  if(new Set(toks.filter(k=>k.t==='n').map(k=>k.i)).size<count)return {st:'incomplete'};
  let pos=0,nonint=false;
  const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
  const norm=([n,d])=>{const g=gcd(n,d)||1;return d<0?[-n/g,-d/g]:[n/g,d/g]};
  const peek=()=>toks[pos],isOp=c=>peek()&&peek().t==='o'&&peek().c===c;
  function expr(){let a=term();for(;;){if(isOp('+')){pos++;const b=term();a=norm([a[0]*b[1]+b[0]*a[1],a[1]*b[1]])}else if(isOp('−')){pos++;const b=term();a=norm([a[0]*b[1]-b[0]*a[1],a[1]*b[1]])}else return a}}
  function term(){let a=factor();for(;;){if(isOp('·')){pos++;const b=factor();a=norm([a[0]*b[0],a[1]*b[1]])}else if(isOp(':')){pos++;const b=factor();if(b[0]===0)throw 0;a=norm([a[0]*b[1],a[1]*b[0]]);if(a[1]!==1)nonint=true}else return a}}
  function factor(){const k=peek();if(!k)throw 0;if(k.t==='n'){pos++;return [k.v,1]}if(isOp('(')){pos++;const a=expr();if(!isOp(')'))throw 0;pos++;return a}throw 0}
  try{const v=expr();if(pos!==toks.length)throw 0;return intOnly&&nonint?{st:'nonint',val:v}:{st:'ok',val:v}}catch(e){return {st:'syntax'}}
}
const toksText=toks=>toks.map(k=>k.t==='n'?String(k.v):k.c).join(' ').replace(/\( /g,'(').replace(/ \)/g,')');

/* Würfel: W6 mit echten Augen, andere Würfel als Vielflächner mit Zahl */
function dieFace(v,sides){
  if(sides===6&&v>=1&&v<=6)return [h('div',{class:'pips p'+v},Array.from({length:v},()=>h('i')))];
  return [h('b',{},String(v)),h('small',{},'W'+sides)];
}
const rolling=()=>typeof G!=='undefined'&&G&&G.rollUntil&&performance.now()<G.rollUntil;
function makeDie(v,sides,small){
  return h('div',{class:`die d${sides}`+(small?' sm':'')+(rolling()?' rolling':''),'data-sides':String(sides)},dieFace(v,sides));
}

/* ---------- 2. THEMA: Kopfrechnen ---------- */
registerTheme((function(){

  /* ===== Spielform 3: Würfel-Rechnen (normale Würfel + Rechenregel) ===== */
  const DRULES=[
    {id:'sum',l:'Alle addieren',f:(d,x)=>({v:d.reduce((a,b)=>a+b,0),t:d.map(x).join(' + ')})},
    {id:'prod',l:'Alle multiplizieren',f:(d,x)=>({v:d.reduce((a,b)=>a*b,1),t:d.map(x).join(' × ')})},

function updateCtrl(){
  const b=G.b,s=G.state,vis=(el,v)=>{el.style.display=v?'':'none'};
  vis(b.start,s==='ready'||s==='roundover');
  vis(b.again,s==='over');
  const typed=!!G.g.typed;
  vis(b.show,s==='running'||(s==='judging'&&!G.revealed&&!typed));
  b.show.textContent=s==='running'?'⏭':'👁';
  b.show.title=s==='running'?'Runde beenden und Lösung zeigen':'Lösung zeigen';
  vis(b.ok,s==='judging'&&!typed);vis(b.no,s==='judging'&&!typed);
}
function rankView(){
  const P=[...G.players].sort((a,b)=>b.score-a.score);let rank=0,prev=null;
  return h('div',{class:'rank'},div('rtitle','Endstand'),P.map((p,i)=>{
    if(p.score!==prev){rank=i+1;prev=p.score}
    const m=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'.';
    return h('div',{class:'rrow',style:`--c:${p.color}`},h('span',{class:'rm'},m),h('span',{class:'rnm'},p.name),h('span',{class:'rsc'},String(p.score)));
  }));
}
function lockLine(){const l=G.players.filter(p=>p.lockNext).map(p=>p.name);return l.length?`  ·  🔒 ${l.join(', ')} pausiert nächste Runde`:''}
function copyContent(){
  const s=G.state;
  const head=h('div',{class:'bhead'},
    h('span',{},G.round?`Runde ${G.round}${G.mode==='rounds'?' / '+G.rounds:''}`:'Bereit'),
    h('span',{class:'rt'+(answerTimer()&&G.inLeft<=3000?' warn':'')},G.round?rtText():''),
    h('span',{class:'gn'},`${G.g.icon} ${G.g.name}`));
  let main,stat='';
  if(s==='ready')main=h('div',{class:'msg'},div('mbig','Los geht’s!'),div('msub','Bereit? Tippe auf ▶ in der Mitte.'));
  else if(s==='countdown')main=h('div',{class:'msg'},div('mbig cd',String(Math.max(1,Math.ceil(G.cd/1000)))),div('msub',`Runde ${G.round}`));
  else if(s==='over'){main=rankView();stat=G.result}
  else{
    let ctx=null,selRes=null;
    if(G.g.typed&&s==='judging')ctx={typed:G.g.typed,entry:G.entry,key:typedKey,neg:!!G.s.neg,toks:G.toks,ops:opsOf(G.s).map(o=>o==='×'?'·':o==='÷'?':':o)};
    if(G.g.checkSelection&&s==='judging'){
      selRes=G.sel.size?G.g.checkSelection(G.rd,[...G.sel]):null;
      ctx={active:true,sel:G.sel,verdict:selRes?(selRes.ok?'ok':'bad'):null,toggle:toggleCell};
    }
    main=G.g.renderBoard(G.rd,G.revealed||s==='roundover',ctx);
    if(s==='running')stat=G.note||'Lösung gefunden? Dann STOP tippen!';
    else if(s==='judging'){
      if(G.g.checkSelection)stat=selRes?`${G.stopper.name}: ${selRes.text}`:`✋ ${G.stopper.name} ruft STOP – ${G.g.selHint||'Zahlen auf dem Brett antippen, um zu prüfen'}`;
      else if(G.g.typed)stat=G.hint||`✋ ${G.stopper.name} ruft STOP – ${G.g.typed==='expr'?'Rechnung eintippen':'Lösung eintippen'} und mit OK bestätigen`;
      else stat=`✋ ${G.stopper.name} ruft STOP – Lösung nennen, dann prüfen`;
    }
    else stat=G.result+lockLine();
  }
  return [head,h('div',{class:'bmain'},main),h('div',{class:'bstat'},stat)];
}
function exprKey(k){
  const T=G.toks,last=T[T.length-1];G.hint='';
  if(k==='✕'){G.state='running';G.stopper=null;G.entry='';G.note='STOP zurückgenommen – weiter geht’s!';renderAll();return}
  if(k==='⌫')T.pop();
  else if(k==='OK'){
    const rd=G.rd,r=G.g.evalEntry(rd,T,G.s);
    if(r.st==='incomplete'){G.hint=rd.minUse>=rd.nums.length?'Es müssen alle Zahlen verwendet werden.':`Es müssen mindestens ${rd.minUse} Zahlen verwendet werden.`;renderBoards();return}
    if(r.st==='syntax'){G.hint='Diese Rechnung ist nicht gültig – bitte korrigieren.';renderBoards();return}
    judge(r.st==='ok'&&r.val[1]===1&&r.val[0]===rd.target);return;
  }
  else if(/^n\d+$/.test(k)){
    const i=+k.slice(1);
    if(T.some(x=>x.t==='n'&&x.i===i))return;
    if(last&&(last.t==='n'||last.c===')'))return;
    T.push({t:'n',i,v:G.rd.nums[i]});
  }
  else if(k==='('){if(last&&(last.t==='n'||last.c===')'))return;T.push({t:'o',c:k})}
  else if(k===')'){
    const open=T.filter(x=>x.c==='(').length-T.filter(x=>x.c===')').length;
    if(open<=0||!last||!(last.t==='n'||last.c===')'))return;T.push({t:'o',c:k})
  }
  else{ if(!last||last.t!=='n'&&last.c!==')')return;T.push({t:'o',c:k}) }
  G.entry=toksText(T);renderBoards();
}
function typedKey(k){
  if(!G||G.state!=='judging'||!G.g.typed)return;
  if(G.g.typed==='expr')return exprKey(k);
  if(k==='⌫')G.entry=G.entry.slice(0,-1);
  else if(k==='±'){G.entry=G.entry.startsWith('-')?G.entry.slice(1):'-'+G.entry}
  else if(k==='✕'){G.state='running';G.stopper=null;G.entry='';G.note='STOP zurückgenommen – weiter geht’s!';renderAll();return}
  else if(k==='OK'){
    if(!/\d/.test(G.entry))return;
    judge(parseInt(G.entry,10)===G.rd.q.answer);return;
  }
  else if(/^\d$/.test(k)&&G.entry.replace('-','').length<7){
    const cur=G.entry.replace('-','');
    if(cur==='0')G.entry=(G.entry.startsWith('-')?'-':'')+k;else G.entry+=k;
  }
  renderBoards();
}
function toggleCell(i){
  if(!G||G.state!=='judging')return;
  if(G.sel.has(i))G.sel.delete(i);
  else{if(G.g.maxSel&&G.sel.size>=G.g.maxSel(G.rd))G.sel.clear();G.sel.add(i)}
  renderBoards();
}
function boardFlipped(){
  let f=!!G.flip&&G.round%2===0;
  // Eingabe-/Antipp-Spiele: das Brett dreht sich zur Person, die STOP gerufen hat und gegenüber sitzt
  if(G.turn&&G.state==='judging'&&G.stopper&&(G.g.typed||G.g.checkSelection))f=G.stopper.i>=Math.ceil(G.players.length/2);
  return f;
}
function renderBoards(){G.cp.forEach(el=>{el.className='bcopy'+(boardFlipped()?' flip':'');el.replaceChildren(...copyContent())})}
function answerTimer(){return G.state==='judging'&&G.inLimit&&!G.revealed}
function rtText(){return answerTimer()?`⏳ ${Math.max(0,Math.ceil(G.inLeft/1000))} s`:G.limit?timeStr(Math.max(0,G.limit-G.elapsed)):timeStr(G.elapsed)}
function tickTime(){document.querySelectorAll('.rt').forEach(el=>{el.textContent=rtText();el.classList.toggle('warn',answerTimer()&&G.inLeft<=3000)})}

function startRound(){
  const P=G.players;
  P.forEach(p=>{p.out=p.lockNext;p.lockNext=false});
  if(P.every(p=>p.out))P.forEach(p=>{p.out=false});
  G.round++;
  G.rd=G.g.createRound(G.s,mulberry32((G.seed+Math.imul(G.round,0x9E3779B1))|0));
  G.sel=new Set();G.state='countdown';G.cd=3000;G.cdShown=null;G.elapsed=0;G.stopper=null;G.revealed=false;G.note='';G.result='';
  renderAll();
}
function loop(){
  const now=performance.now(),dt=Math.min(250,now-lastT);lastT=now;
  if(!G)return;
  if(G.state==='countdown'){
    G.cd-=dt;
    if(G.cd<=0){G.state='running';G.elapsed=0;renderAll();beep(990,.15);if(G.g.rolls)startRoll()}
    else{const n=Math.ceil(G.cd/1000);if(n!==G.cdShown){G.cdShown=n;renderBoards();beep(440,.07)}}
  }else if(G.state==='running'){
    G.elapsed+=dt;tickTime();
    if(G.limit&&G.elapsed>=G.limit){G.result='⏱ Zeit abgelaufen – niemand hatte die Lösung';endRound()}
  }else if(G.state==='judging'&&G.inLimit&&!G.revealed){
    G.inLeft-=dt;tickTime();
    if(G.inLeft<=0)judge(false,true);
  }
}
function startRoll(){
  const ROLL=1300;
  G.rollUntil=performance.now()+ROLL;renderBoards();
  const rd=G.rd,iv=setInterval(()=>{
    if(!G||G.rd!==rd||performance.now()>=G.rollUntil){clearInterval(iv);if(G&&G.rd===rd){G.rollUntil=0;renderBoards()}return}
    document.querySelectorAll('.bcopy .die[data-sides]').forEach(el=>{
      const sd=+el.dataset.sides,v=1+Math.floor(Math.random()*sd);
      el.replaceChildren(...dieFace(v,sd));
    });
    beep(180+Math.random()*260,.03,'square');
  },85);
}
function onStart(){if(!G)return;if(G.state==='ready'||G.state==='roundover')startRound()}
function onShow(){
  if(!G)return;
  if(G.state==='running'){G.result='Runde beendet – Lösung wird gezeigt';endRound()}
  else if(G.state==='judging'&&!G.revealed){G.revealed=true;updateCtrl();renderBoards()}
}
function stopPlayer(p){
  if(!G||G.state!=='running'||p.out||(G.rollUntil&&performance.now()<G.rollUntil))return;
  G.sel=new Set();G.entry='';G.toks=[];G.hint='';G.state='judging';G.stopper=p;G.revealed=false;G.note='';G.inLeft=G.inLimit;beep(300,.18,'square');renderAll();
}
function judge(ok,timeout){
  if(!G||G.state!=='judging')return;
  const p=G.stopper;
  const typedV=G.g.typed&&G.entry?` (${G.entry.replace('-','−')})`:'';
  if(ok){const gain=G.g.gain?G.g.gain(G.rd,G.sel):1;p.score+=gain;G.result=`✓ ${p.name}${typedV}: richtig, +${gain} Punkt${gain>1?'e':''}`;beep(660,.1);setTimeout(()=>beep(880,.15),110);endRound();return}
  p.out=true;beep(160,.3,'square');
  const lock=G.pen==='lock'||G.pen==='both',minus=G.pen==='point'||G.pen==='both';
  if(lock)p.lockNext=true;
  if(minus)p.score-=1;
  const suffix=lock&&minus?' (−1 Punkt, pausiert die nächste Runde)':lock?' und pausiert die nächste Runde':minus?' (−1 Punkt)':' (gesperrt für diese Rechnung)';
  const none=G.players.every(q=>q.out);
  const what=timeout?`⏱ ${p.name}: Zeit zum Antworten abgelaufen`:`✗ ${p.name}${typedV} lag falsch`;
  if(G.revealed||none){G.result=what+suffix+(none?' – niemand ist mehr im Rennen':'');endRound()}
  else{G.sel=new Set();G.state='running';G.stopper=null;G.note=what+suffix;renderAll()}
}
function endRound(){G.state='roundover';G.revealed=true;checkEnd();renderAll()}
function checkEnd(){
  if(G.state==='over')return;
  const P=G.players;
  if((G.mode==='points'&&P.some(p=>p.score>=G.points))||(G.mode==='rounds'&&G.round>=G.rounds&&G.state==='roundover')){
    G.state='over';beep(523,.15);setTimeout(()=>beep(659,.15),160);setTimeout(()=>beep(784,.25),320);
  }
}
function adjust(p,d){
  if(!G)return;
  p.score=Math.max(-99,p.score+d);
  if(G.state==='ready'||G.state==='roundover')checkEnd();
  renderAll();
}
document.addEventListener('gesturestart',e=>e.preventDefault());
renderSetup();
</script>
